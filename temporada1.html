<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temporada 1: Programação</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }

        .header-temp {
            text-align: center;
            margin-bottom: 30px;
        }

        .header-temp h1 {
            color: #00adb5;
            font-size: 2rem;
        }

        /* Lista de Episódios/Matérias */
        .lista-episodios {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .item-aula {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-left: 5px solid #00adb5;
            transition: 0.3s;
        }

        .item-aula:hover {
            background: #252525;
            transform: translateX(10px);
        }

        .numero {
            font-weight: bold;
            color: #00adb5;
            font-size: 1.2rem;
        }

        /* Botão para Voltar */
        .btn-voltar {
            margin-top: 40px;
            text-decoration: none;
            color: #121212;
            background: #00adb5;
            padding: 10px 25px;
            border-radius: 5px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-voltar:hover {
            background: #ffffff;
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <div class="header-temp">
        <h1>Temporada 1: Programação 💻</h1>
        <p>Conteúdos que aprendi nesta jornada</p>
    </div>

    <div class="lista-episodios">
        <div class="item-aula">
            <span class="numero">01</span>
            <div>
                <strong>Introdução ao HTML</strong>
                <p style="font-size: 0.8rem; color: #bbb;">Criando a estrutura básica do site.</p>
            </div>
        </div>

        <div class="item-aula">
            <span class="numero">02</span>
            <div>
                <strong>Estilização com CSS</strong>
                <p style="font-size: 0.8rem; color: #bbb;">Cores, fontes e layouts modernos.</p>
            </div>
        </div>

        <div class="item-aula">
            <span class="numero">03</span>
            <div>
                <strong>Publicação no GitHub</strong>
                <p style="font-size: 0.8rem; color: #bbb;">Colocando o site no ar para o mundo.</p>
            </div>
        </div>
    </div>

    <!-- Esse é o botão de voltar clicável -->
    <a href="index.html" class="btn-voltar">⬅ VOLTAR AO INÍCIO</a>

</body>
</html>
